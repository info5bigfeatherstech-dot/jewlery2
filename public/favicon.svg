<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Midnight Royal Navy -->
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A1C42" />
      <stop offset="85%" stop-color="#051025" />
      <stop offset="100%" stop-color="#030814" />
    </radialGradient>

    <!-- Metallic 24K Royal Gold Gradient -->
    <linearGradient id="goldFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE" />
      <stop offset="25%" stop-color="#F5CF64" />
      <stop offset="50%" stop-color="#D49B24" />
      <stop offset="78%" stop-color="#B37C12" />
      <stop offset="100%" stop-color="#FEE699" />
    </linearGradient>

    <!-- Highlight / Shimmer Gold -->
    <linearGradient id="goldLight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D49B24" stop-opacity="0.5" />
    </linearGradient>

    <!-- Deep Gold Shadow -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5C0B" />
      <stop offset="100%" stop-color="#543707" />
    </linearGradient>

    <!-- Brilliant Solitaire Diamond Gradient -->
    <linearGradient id="gemFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="75%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Medallion Shield with Gold Border -->
  <circle cx="100" cy="100" r="95" fill="url(#navyBg)" stroke="url(#goldFavicon)" stroke-width="4.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldFavicon)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Outer Beads on Rim -->
  <circle cx="100" cy="10" r="3" fill="url(#goldFavicon)" />
  <circle cx="100" cy="190" r="3" fill="url(#goldFavicon)" />
  <circle cx="10" cy="100" r="3" fill="url(#goldFavicon)" />
  <circle cx="190" cy="100" r="3" fill="url(#goldFavicon)" />

  <!-- Crown Apex 4-Point Brilliant Star -->
  <g transform="translate(100, 32)">
    <path d="M 0 -11 Q 0.6 -2 5 0 Q 0.6 2 0 11 Q -0.6 2 -5 0 Q -0.6 -2 0 -11 Z" fill="url(#goldFavicon)" />
    <circle cx="0" cy="0" r="1.6" fill="#FFFFFF" />
  </g>

  <!-- Decorative Royal Arch -->
  <path
    d="M 44 140 C 34 114, 40 76, 68 54 C 78 46, 88 42, 100 42 C 112 42, 122 46, 132 54 C 160 76, 166 114, 156 140"
    stroke="url(#goldFavicon)"
    stroke-width="1.8"
    stroke-linecap="round"
    fill="none"
    opacity="0.85"
  />

  <!-- Solitaire Faceted Diamond Apex -->
  <polygon points="100,60 117,73 100,88 83,73" fill="url(#gemFavicon)" stroke="url(#goldFavicon)" stroke-width="1.2" />
  <polygon points="100,60 109,69 100,73 91,69" fill="#FFFFFF" opacity="0.95" />
  <polygon points="100,73 117,73 100,88" fill="#BAE6FD" opacity="0.75" />
  <polygon points="100,73 83,73 100,88" fill="#7DD3FC" opacity="0.85" />
  <!-- Diamond Sparkle Center -->
  <circle cx="100" cy="73" r="1.8" fill="#FFFFFF" />

  <!-- Monogram 'A' Pillars -->
  <!-- Left Pillar -->
  <path d="M 94 83 L 56 156 L 70 156 L 86 122 L 98 98 Z" fill="url(#goldFavicon)" />
  <path d="M 94 83 L 86 122 L 70 156 L 64 156 L 91 86 Z" fill="url(#goldLight)" opacity="0.7" />

  <!-- Right Pillar -->
  <path d="M 106 83 L 144 156 L 130 156 L 114 122 L 102 98 Z" fill="url(#goldFavicon)" />
  <path d="M 106 83 L 114 122 L 130 156 L 136 156 L 109 86 Z" fill="url(#goldDark)" opacity="0.5" />

  <!-- Base Footings -->
  <path d="M 48 156 L 76 156 C 76 156, 73 153, 67 153 L 54 153 C 49 153, 48 156, 48 156 Z" fill="url(#goldFavicon)" />
  <path d="M 124 156 L 152 156 C 152 156, 149 153, 145 153 L 132 153 C 127 153, 124 156, 124 156 Z" fill="url(#goldFavicon)" />

  <!-- Ribbon Crossbar Loop -->
  <path
    d="M 46 118 C 60 110, 78 114, 94 124 C 102 129, 108 138, 104 146 C 100 153, 91 151, 89 143 C 86 133, 102 120, 122 116 C 138 113, 150 120, 154 128 C 156 132, 152 136, 146 135"
    stroke="url(#goldFavicon)"
    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Bottom Accent Pips -->
  <polygon points="100,165 103,170 100,175 97,170" fill="url(#goldFavicon)" />
  <circle cx="88" cy="170" r="1.3" fill="url(#goldFavicon)" opacity="0.75" />
  <circle cx="112" cy="170" r="1.3" fill="url(#goldFavicon)" opacity="0.75" />
</svg>