<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <defs>
    <!-- Metallic 24K Royal Gold Gradient -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE" />
      <stop offset="25%" stop-color="#F5CF64" />
      <stop offset="50%" stop-color="#D49B24" />
      <stop offset="78%" stop-color="#B37C12" />
      <stop offset="100%" stop-color="#FEE699" />
    </linearGradient>

    <!-- Highlight / Shimmer Gold -->
    <linearGradient id="logoGoldLight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D49B24" stop-opacity="0.5" />
    </linearGradient>

    <!-- Deep Gold Shadow -->
    <linearGradient id="logoGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5C0B" />
      <stop offset="100%" stop-color="#543707" />
    </linearGradient>

    <!-- Brilliant Solitaire Diamond Gradient -->
    <linearGradient id="logoGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="75%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Side: Royal Emblem Mark (Scaled and positioned at x=10, y=10) -->
  <g transform="translate(10, 5) scale(0.65)">
    <!-- Beads -->
    <circle cx="100" cy="18" r="2.5" fill="url(#logoGold)" />
    <circle cx="78" cy="22" r="2" fill="url(#logoGold)" opacity="0.85" />
    <circle cx="122" cy="22" r="2" fill="url(#logoGold)" opacity="0.85" />
    <circle cx="58" cy="33" r="1.8" fill="url(#logoGold)" opacity="0.75" />
    <circle cx="142" cy="33" r="1.8" fill="url(#logoGold)" opacity="0.75" />
    <circle cx="42" cy="50" r="1.8" fill="url(#logoGold)" opacity="0.7" />
    <circle cx="158" cy="50" r="1.8" fill="url(#logoGold)" opacity="0.7" />
    <circle cx="30" cy="72" r="1.8" fill="url(#logoGold)" opacity="0.65" />
    <circle cx="170" cy="72" r="1.8" fill="url(#logoGold)" opacity="0.65" />
    <circle cx="24" cy="98" r="1.8" fill="url(#logoGold)" opacity="0.6" />
    <circle cx="176" cy="98" r="1.8" fill="url(#logoGold)" opacity="0.6" />

    <!-- Outer Arches -->
    <path
      d="M 32 138 C 22 108, 28 66, 60 40 C 72 30, 85 24, 100 24 C 115 24, 128 30, 140 40 C 172 66, 178 108, 168 138"
      stroke="url(#logoGold)"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 40 132 C 32 106, 38 72, 65 50 C 75 42, 87 36, 100 36 C 113 36, 125 42, 135 50 C 162 72, 168 106, 160 132"
      stroke="url(#logoGold)"
      stroke-width="1.2"
      stroke-linecap="round"
      fill="none"
      opacity="0.5"
    />

    <!-- Crown Star -->
    <g transform="translate(100, 14)">
      <path d="M 0 -12 Q 0.6 -2 6 0 Q 0.6 2 0 12 Q -0.6 2 -6 0 Q -0.6 -2 0 -12 Z" fill="url(#logoGold)" />
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Solitaire Diamond Apex -->
    <polygon points="100,52 118,66 100,82 82,66" fill="url(#logoGem)" stroke="url(#logoGold)" stroke-width="1.2" />
    <polygon points="100,52 110,61 100,66 90,61" fill="#FFFFFF" opacity="0.9" />
    <polygon points="100,66 118,66 100,82" fill="#BAE6FD" opacity="0.65" />
    <polygon points="100,66 82,66 100,82" fill="#7DD3FC" opacity="0.8" />
    <circle cx="100" cy="66" r="1.6" fill="#FFFFFF" />

    <!-- Monogram 'A' Pillars -->
    <path d="M 94 77 L 54 156 L 68 156 L 86 120 L 98 94 Z" fill="url(#logoGold)" />
    <path d="M 94 77 L 86 120 L 68 156 L 62 156 L 91 80 Z" fill="url(#logoGoldLight)" opacity="0.75" />
    <path d="M 106 77 L 146 156 L 132 156 L 114 120 L 102 94 Z" fill="url(#logoGold)" />
    <path d="M 106 77 L 114 120 L 132 156 L 138 156 L 109 80 Z" fill="url(#logoGoldDark)" opacity="0.45" />

    <!-- Base Footings -->
    <path d="M 46 156 L 76 156 C 76 156, 73 153, 67 153 L 53 153 C 48 153, 46 156, 46 156 Z" fill="url(#logoGold)" />
    <path d="M 124 156 L 154 156 C 154 156, 151 153, 147 153 L 133 153 C 127 153, 124 156, 124 156 Z" fill="url(#logoGold)" />

    <!-- Ribbon Loop -->
    <path
      d="M 44 116 C 58 108, 76 112, 92 122 C 100 127, 108 136, 104 145 C 100 152, 91 150, 89 142 C 86 132, 102 118, 122 114 C 138 111, 152 118, 158 126 C 160 130, 156 135, 150 134 C 142 133, 134 124, 120 122 C 108 120, 96 128, 88 138 C 82 147, 84 156, 94 158 C 106 160, 114 149, 118 138"
      stroke="url(#logoGold)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Right Side: Refined Brand Wordmark Lockup -->
  <g transform="translate(150, 42)">
    <!-- "AURELIA" Title -->
    <text
      x="0"
      y="38"
      fill="#0A1C42"
      font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif"
      font-size="44"
      font-weight="700"
      letter-spacing="-0.02em"
    >
      Aurelia
    </text>

    <!-- "JEWELS" Sub-wordmark -->
    <text
      x="172"
      y="36"
      fill="url(#logoGold)"
      font-family="'Playfair Display', Georgia, serif"
      font-size="28"
      font-weight="400"
      letter-spacing="0.25em"
    >
      JEWELS
    </text>

    <!-- Tagline: Handcrafted Luxury Jaipur -->
    <g transform="translate(2, 64)">
      <text
        x="0"
        y="0"
        fill="#D49B24"
        font-size="10"
      >✦</text>
      <text
        x="16"
        y="-1"
        fill="#7A584A"
        font-family="'Poppins', sans-serif"
        font-size="11"
        font-weight="500"
        letter-spacing="0.32em"
      >HANDCRAFTED LUXURY • JAIPUR</text>
      <text
        x="276"
        y="0"
        fill="#D49B24"
        font-size="10"
      >✦</text>
    </g>
  </g>
</svg>
